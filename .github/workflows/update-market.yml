name: Update market rate

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the market price from the Telegram channel
        run: node scripts/update-market.mjs
      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add market.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update market rate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
