name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'rates.json'
      - 'www/rates-bundled.js'
      - 'README.md'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Sarafa-Setup-*.exe
            dist/Sarafa-Portable-*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Make sure the Android platform and build tools are installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sarafa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Sarafa.apk
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-extension.mjs
      - name: Zip the extension
        run: cd dist-extension && zip -r ../Sarafa-Chrome-Extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: Sarafa-Chrome-Extension.zip
          if-no-files-found: error

  release:
    needs: [windows, android, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the files on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/* \
            --title "آخر نسخة" \
            --notes "ويندوز: Sarafa-Setup (يتثبت) أو Sarafa-Portable (يشتغل مباشرة). أندرويد: Sarafa.apk. كروم: Sarafa-Chrome-Extension.zip (فك الضغط ثم حمّل غير مضغوطة من chrome://extensions). الملفات غير موقّعة تجارياً، فيظهر تحذير أول مرة."
